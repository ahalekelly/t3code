name: Fork Mac release

# Builds the macOS desktop app for each main revision whose Fork release run passed, when its code
# changed since its last release, and publishes it as `mac-<version>` with that run's version and
# JS bundle. It waits for GitHub's scarce macOS runners, so nothing that ships main waits for it,
# and a newer main replaces a waiting run but never cancels a running one. fork-ios-release.yml
# does the same for the iPhone app, in its own queue.
# Mac apps update from latest-mac.yml on the mac-update-feed branch, which points into the newest
# `mac-` release, because electron-updater otherwise reads the Latest release, which has no Mac build.

on:
  workflow_run:
    workflows: [Fork release]
    types: [completed]

# Only a passing run's Mac run may replace a waiting one; any other run gets a group of its own.
concurrency:
  group: fork-mac-release-${{ github.event.workflow_run.conclusion == 'success' && 'main' || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  # release-desktop.yml asks for it; a called workflow gets no more than its caller.
  actions: read

env:
  SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  plan:
    name: Read the release plan
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      base: ${{ steps.plan.outputs.base }}
      mac: ${{ steps.plan.outputs.mac }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-plan
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - id: plan
        run: tee -a "$GITHUB_OUTPUT" < release-plan.env

  # The Mac runs the desktop app, which bundles its own server, so it needs no CLI archive.
  desktop_mac_arm64:
    name: macOS arm64
    needs: [plan]
    if: needs.plan.outputs.mac == 'true'
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      ref: ${{ github.event.workflow_run.head_sha }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: pk_live_Y2xlcmsudDMuY29kZXMk
      clerk_jwt_template: t3-relay
      clerk_cli_oauth_client_id: hzxSgY2cH10sDU2r
      relay_url: https://relay.t3.codes
      update_url: https://raw.githubusercontent.com/${{ github.repository }}/mac-update-feed/
      bundle_run_id: ${{ github.event.workflow_run.id }}
      label: macOS arm64
      runner: macos-26
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      launch_check: true
    secrets:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

  release_mac:
    name: Publish macOS release
    needs: [plan, desktop_mac_arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.plan.outputs.version }}
      BASE: ${{ needs.plan.outputs.base }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: desktop-mac-arm64
          path: release-mac

      - name: Publish macOS release
        run: |
          gh release create "mac-$VERSION" release-mac/* \
            --target "$SHA" --title "T3 Code macOS $VERSION" --latest=false \
            --notes "Fork macOS build of \`main\` at $SHA, on upstream $BASE."

  # Its own job, so a failed push reruns without publishing the release again.
  feed_mac:
    name: Point the Mac update feed at the release
    needs: [plan, release_mac]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      # electron-updater resolves the feed's file names against the feed's URL, so this copy names
      # them by their download URLs. A rerun of an older revision's run leaves a newer feed alone.
      - run: |
          set -euo pipefail
          current=$(curl -fsSL "https://raw.githubusercontent.com/$GH_REPO/mac-update-feed/latest-mac.yml" | sed -n 's/^version: //p' || true)
          if [[ -n "$current" && 10#${current##*-} -ge 10#${VERSION##*-} ]]; then
            echo "The feed already names $current"
            exit 0
          fi
          mkdir feed
          gh release download "mac-$VERSION" --pattern latest-mac.yml --dir release-mac
          sed -E "s#^(  - url: |path: )#\1https://github.com/$GH_REPO/releases/download/mac-$VERSION/#" \
            release-mac/latest-mac.yml > feed/latest-mac.yml
          cat feed/latest-mac.yml
          cd feed
          git init -q
          git add latest-mac.yml
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "macOS $VERSION"
          git push --force "https://x-access-token:$GH_TOKEN@github.com/$GH_REPO.git" HEAD:refs/heads/mac-update-feed
