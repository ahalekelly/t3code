name: Fork release

# Tests each main revision and publishes the builds whose code changed since their last release:
# the Linux and Windows desktop apps and the CLI as this repository's Latest release `v<version>`,
# and the Android app as `android-<version>`. Once a run passes, fork-mac-release.yml builds the
# macOS and iPhone apps, which wait for GitHub's scarce macOS runners, as `mac-<version>` and
# `ios-<version>`. Only `v` releases are ever Latest. Installed fork builds update from these releases.
# Versions are prereleases of the next upstream patch, `<major>.<minor>.<patch + 1>-akelly-<run>`,
# so each one ranks above the upstream release it is built on and below the next one. The run is
# zero-padded to four digits, because GitHub lists a day's releases by comparing that part as text.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fork-release
  cancel-in-progress: true

permissions:
  contents: read
  # release-desktop.yml asks for it; a called workflow gets no more than its caller.
  actions: read

jobs:
  preflight:
    name: Resolve version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      base: ${{ steps.version.outputs.base }}
      host: ${{ steps.changes.outputs.host }}
      mac: ${{ steps.changes.outputs.mac }}
      android: ${{ steps.changes.outputs.android }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - id: version
        name: Resolve version
        run: |
          set -euo pipefail
          # The upstream tag main is built on, usually a nightly. The fork's own release tags can sit
          # on main itself.
          base=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-akelly-*' HEAD)
          # Versions count from the newest stable tag main contains; version sort ranks prereleases
          # above it, so drop them.
          stable=$(git tag --merged HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -v -m1 -- -)
          IFS=. read -r major minor patch <<<"${stable#v}"
          version=$(printf '%s.%s.%s-akelly-%04d' "$major" "$minor" "$((patch + 1))" "$GITHUB_RUN_NUMBER")
          echo "Building $version on $base"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Each file changed since a release maps to its innermost package, and pnpm adds every package
      # depending on those. The root package stands for files outside any package, and the mobile
      # app config imports scripts/. Not pnpm's `[<ref>]` filter: main is rebuilt on every push, so
      # a release is never its ancestor, and that filter diffs from their merge-base instead.
      # The Linux and Windows base is the Latest release; each other app's base is its highest-run tag.
      - id: changes
        name: Find the builds to release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BASE: ${{ steps.version.outputs.base }}
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          packages=$(npx --yes corepack pnpm ls -r --depth -1 --json | jq --arg root "$PWD/" 'map({name, dir: (.path + "/" | ltrimstr($root))})')
          affects() {
            local base=$1; shift
            if [[ -z "$base" ]]; then echo true; return; fi
            local changed listed
            changed=$(git diff --name-only --no-renames "$base" HEAD -- ':!*.md' | jq -Rnr --argjson packages "$packages" \
              '[inputs as $file | $packages | map(select(.dir as $dir | $file | startswith($dir))) | max_by(.dir | length).name] | unique[] | "--filter=...\(.)"')
            if [[ -z "$changed" ]]; then echo false; return; fi
            mapfile -t changed <<<"$changed"
            listed=$(npx --yes corepack pnpm "${changed[@]}" ls --depth -1 --json)
            jq --args 'any(.[].name; IN($ARGS.positional[]))' @t3tools/monorepo @t3tools/scripts "$@" <<<"$listed"
          }
          last_tag() {
            git tag --list "$1-[0-9]*" | awk -F- '{ print $NF, $0 }' | sort -n | awk 'END { print $2 }'
          }
          host_base=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          mac_base=$(last_tag mac)
          ios_base=$(last_tag ios)
          android_base=$(last_tag android)
          host=$(affects "$host_base" t3 @t3tools/web @t3tools/desktop)
          mac=$(affects "$mac_base" t3 @t3tools/web @t3tools/desktop)
          ios=$(affects "$ios_base" @t3tools/mobile)
          android=$(affects "$android_base" @t3tools/mobile)
          echo "Linux, Windows, and CLI: $host since $host_base; macOS: $mac since ${mac_base:-no release}"
          echo "iPhone: $ios since ${ios_base:-no release}; Android: $android since ${android_base:-no release}"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "mac=$mac" >> "$GITHUB_OUTPUT"
          echo "android=$android" >> "$GITHUB_OUTPUT"
          printf 'version=%s\nbase=%s\nmac=%s\nios=%s\n' "$VERSION" "$BASE" "$mac" "$ios" > release-plan.env

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-plan
          path: release-plan.env
          if-no-files-found: error
          # fork-mac-release.yml reads it, and the bundle, from this run, maybe after a long wait.
          retention-days: 3

      # Fork migrations collide with upstream's numbering when the fork moves to a new release.
      - name: Refuse fork-only database migrations
        env:
          BASE: ${{ steps.version.outputs.base }}
        run: |
          set -euo pipefail
          added=$(git diff --name-only --diff-filter=A "$BASE" HEAD -- apps/server/src/persistence/Migrations ':!*.test.ts')
          if [[ -n "$added" ]]; then
            printf 'Fork branches add database migrations; land them upstream first:\n%s\n' "$added" >&2
            exit 1
          fi

  # No `vp check`: lint rules gate upstream PRs, not whether a build works.
  quality:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-ci-deps
      - run: vp run --filter @t3tools/desktop ensure:electron
      - run: vp run typecheck

  # The three slowest packages take about as long as all the others together.
  test:
    name: Package tests (${{ matrix.packages }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - packages: slowest
            filter: --filter @t3tools/client-runtime --filter @t3tools/mobile --filter @t3tools/task-cache
          - packages: others
            filter: >-
              --filter '!@t3tools/client-runtime' --filter '!@t3tools/mobile' --filter '!@t3tools/task-cache'
              --filter '!t3' --filter '!@t3tools/monorepo' --filter '!@t3tools/web'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-ci-deps
      - run: vp run --filter @t3tools/desktop ensure:electron
      - run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config build-essential
      - run: vp run --parallel --concurrency-limit 4 ${{ matrix.filter }} test

  test_web:
    name: Web tests ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-ci-deps
      - run: node apps/web/node_modules/playwright/cli.js install --with-deps --only-shell chromium
      - run: vp run --filter @t3tools/web test --shard ${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Boot the built web client
        if: matrix.shard == 1
        run: |
          vp run --filter @t3tools/web build
          node apps/web/scripts/verify-built-boot.ts

  test_server:
    name: Server tests ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-ci-deps
      - run: node apps/server/node_modules/playwright-core/cli.js install --with-deps --only-shell chromium
      - run: vp run --filter t3 test --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  # T3 Connect's public values, baked into the bundle so fork builds use upstream's relay.
  build_bundle:
    name: Build JS bundle
    needs: [preflight]
    if: needs.preflight.outputs.host == 'true' || needs.preflight.outputs.mac == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsudDMuY29kZXMk
      T3CODE_CLERK_JWT_TEMPLATE: t3-relay
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: hzxSgY2cH10sDU2r
      T3CODE_RELAY_URL: https://relay.t3.codes
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...
      - run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"
      - run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
      - name: Build JS bundle
        env:
          T3CODE_TELEMETRY_CHANNEL: dev
        run: vp run build:desktop
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 3

  desktop_linux_x64:
    name: Linux x64
    needs: [preflight, build_bundle]
    if: needs.preflight.outputs.host == 'true'
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ github.sha }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: pk_live_Y2xlcmsudDMuY29kZXMk
      clerk_jwt_template: t3-relay
      clerk_cli_oauth_client_id: hzxSgY2cH10sDU2r
      relay_url: https://relay.t3.codes
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true
      launch_check: true

  # Packaged on Linux, checked on Windows. Embeds the Linux CLI archive for the WSL backend.
  desktop_win_x64:
    name: Windows x64
    needs: [preflight, build_bundle]
    if: needs.preflight.outputs.host == 'true'
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ github.sha }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: pk_live_Y2xlcmsudDMuY29kZXMk
      clerk_jwt_template: t3-relay
      clerk_cli_oauth_client_id: hzxSgY2cH10sDU2r
      relay_url: https://relay.t3.codes
      label: Windows x64
      runner: ubuntu-24.04
      verify_runner: windows-2025
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64

  android_apk:
    name: Android
    needs: [preflight]
    if: needs.preflight.outputs.android == 'true'
    uses: ./.github/workflows/fork-android-apk.yml
    # It deletes the ccache its new one replaces.
    permissions:
      contents: read
      actions: write
    with:
      version: ${{ needs.preflight.outputs.version }}
    secrets: inherit

  release:
    name: Publish release
    needs: [preflight, quality, test, test_web, test_server, desktop_linux_x64, desktop_win_x64]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      # The build job suffixes the Windows feed with its arch; electron-updater reads latest.yml.
      - name: Name the Windows update feed
        run: mv release-assets/latest-win-x64.yml release-assets/latest.yml

      # Installers verify archives against this file.
      - name: Write CLI archive checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          sha256sum t3-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.preflight.outputs.version }}
          BASE: ${{ needs.preflight.outputs.base }}
        run: |
          gh release create "v$VERSION" release-assets/* \
            --target "$GITHUB_SHA" --title "T3 Code $VERSION" --latest \
            --notes "Fork build of \`main\` at $GITHUB_SHA, on upstream $BASE."

  release_android:
    name: Publish Android release
    needs: [preflight, quality, test, test_web, test_server, android_apk]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: android-apk
          path: release-android

      - name: Publish Android release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.preflight.outputs.version }}
          BASE: ${{ needs.preflight.outputs.base }}
        run: |
          gh release create "android-$VERSION" release-android/* \
            --target "$GITHUB_SHA" --title "T3 Code Android $VERSION" --latest=false \
            --notes "Fork Android build of \`main\` at $GITHUB_SHA, on upstream $BASE."
