name: Fork Android build

# Builds the production app as an arm64 release APK for Adrian's Pixel, signed with the fork's key.
# Its version code is the version's run number. fork-release.yml calls it when the app's code
# changes; dispatch it to try a branch.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Release version to stamp, such as 0.1.7-akelly-0001
        required: true

permissions:
  contents: read
  # It deletes the ccache its new one replaces.
  actions: write

jobs:
  apk:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # T3 Connect's public values, as in fork-release.yml. Without them the app never loads its
      # T3 Connect sign-in, so no environment connects.
      T3CODE_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsudDMuY29kZXMk
      T3CODE_CLERK_JWT_TEMPLATE: t3-relay
      T3CODE_RELAY_URL: https://relay.t3.codes
      APP_VARIANT: production
      T3CODE_ANDROID_PACKAGE: com.akelly.t3code
      EXPO_NO_GIT_STATUS: "1"
      # No upstream OTA update matches this build's native project, so skip both the update
      # checks and the fingerprint that names its runtime.
      T3CODE_MOBILE_UPDATES_ENABLED: "0"
      MOBILE_VERSION_POLICY: appVersion
      VERSION: ${{ inputs.version }}
      # The app's About screen shows this release.
      T3CODE_RELEASE_VERSION: ${{ inputs.version }}
    steps:
      # The app's About screen names the upstream release it builds on, from `git describe`.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/mobile... --filter=@t3tools/scripts...
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"
      # Only a build of main that passed saves caches. A failed build's Gradle home holds just the
      # tasks it reached, and the next build would start from that instead of a full one. The
      # action reads this input again when it saves, after the build.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' || job.status != 'success' }}
      - run: sudo apt-get install -y ccache
      - id: ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/ccache
          key: android-ccache-${{ github.run_id }}
          restore-keys: android-ccache-

      - name: Generate the native project
        working-directory: apps/mobile
        run: T3CODE_ANDROID_VERSION_CODE="$((10#${VERSION##*-}))" vp exec expo prebuild --clean --platform android --no-install

      # Android Studio's injected signing properties override the generated debug signing.
      # R8 takes about 8 minutes, so this personal build skips it, and resource shrinking, which
      # needs it. setup-gradle saves the build cache with Gradle's home for the next run, but
      # Gradle caches no C++ compiles; ccache does. Without the sloppiness, ccache refuses every
      # compile that uses a precompiled header.
      - name: Build the APK
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_DIR: ${{ runner.temp }}/ccache
          CCACHE_MAXSIZE: 500M
          CCACHE_COMPILERCHECK: content
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: "1"
          CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease --build-cache --profile -PreactNativeArchitectures=arm64-v8a \
            -Pandroid.enableMinifyInReleaseBuilds=false -Pandroid.enableShrinkResourcesInReleaseBuilds=false \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias=t3code \
            -Pandroid.injected.signing.key.password="$ANDROID_KEYSTORE_PASSWORD"
          ccache --show-stats
          mkdir -p "$GITHUB_WORKSPACE/release-android"
          mv app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/release-android/T3-Code-$VERSION.apk"

      # Deleted before the save: the repository's caches sit near its 10 GB limit, where saving one
      # evicts the least recently used, often this build's own Gradle caches.
      - name: Delete the replaced ccache
        if: github.ref == 'refs/heads/main' && steps.ccache.outputs.cache-matched-key != ''
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_KEY: ${{ steps.ccache.outputs.cache-matched-key }}
        run: gh cache delete "$OLD_KEY" -R "$GITHUB_REPOSITORY"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: github.ref == 'refs/heads/main'
        with:
          path: ${{ runner.temp }}/ccache
          key: android-ccache-${{ github.run_id }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-apk
          path: release-android/*.apk
          if-no-files-found: error

      # Per-task build times, for finding what still makes the build slow.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: android-build-profile
          path: apps/mobile/android/build/reports/profile/
          retention-days: 14
