name: Fork iPhone build

# Builds the production app as an ad hoc IPA for Adrian's iPhone, signed by his team. The build
# number is the version's run number, so `xcrun devicectl device info apps` shows which release a
# phone runs. fork-release.yml calls it for each release; dispatch it to try a branch.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Release version to stamp, such as 0.1.6-fork-0001
        required: true

permissions:
  contents: read

jobs:
  ipa:
    name: iPhone
    runs-on: macos-26
    timeout-minutes: 120
    env:
      APP_VARIANT: production
      T3CODE_IOS_SIGNING: personal
      T3CODE_IOS_BUNDLE_ID: com.akelly.t3code
      T3CODE_IOS_TEAM_ID: T3TBGN4UX7
      EXPO_NO_GIT_STATUS: "1"
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/mobile... --filter=@t3tools/scripts...

      # Xcode signs the archive with the development identity and the ad hoc export with the
      # distribution one; the API key lets it fetch the matching provisioning profiles.
      - name: Import signing identities
        env:
          IOS_DEVELOPMENT_P12: ${{ secrets.IOS_DEVELOPMENT_P12 }}
          IOS_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/ios-signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$IOS_DEVELOPMENT_P12" | base64 --decode > "$RUNNER_TEMP/development.p12"
          printf '%s' "$IOS_DISTRIBUTION_P12" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          for identity in development distribution; do
            security import "$RUNNER_TEMP/$identity.p12" -k "$keychain" -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          printf '%s' "$APPLE_API_KEY" > "$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"

      - name: Generate the native project
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          vp exec expo prebuild --clean --platform ios --no-install
          cd ios
          # Pods compile host stubs with a bare clang; point it at Xcode's SDK.
          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)" pod install

      - name: Archive and export the IPA
        working-directory: apps/mobile/ios
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          workspace=$(ls -d *.xcworkspace)
          scheme=${workspace%.xcworkspace}
          # Generated extension plists take their build number from Xcode's build setting.
          for target in "$scheme" ExpoWidgetsTarget expo-sharing-extension; do
            /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion $(CURRENT_PROJECT_VERSION)' "$target/Info.plist"
          done
          echo "export NODE_BINARY=$(command -v node)" > .xcode.env.local
          signing=(-allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
            -authenticationKeyID "$APPLE_API_KEY_ID" -authenticationKeyIssuerID "$APPLE_API_ISSUER")
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release \
            -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/T3Code.xcarchive" "${signing[@]}" \
            CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM="$T3CODE_IOS_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$((10#${VERSION##*-}))" archive
          plutil -create xml1 "$RUNNER_TEMP/options.plist"
          plutil -insert method -string release-testing "$RUNNER_TEMP/options.plist"
          plutil -insert teamID -string "$T3CODE_IOS_TEAM_ID" "$RUNNER_TEMP/options.plist"
          plutil -insert signingStyle -string automatic "$RUNNER_TEMP/options.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/T3Code.xcarchive" -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/options.plist" "${signing[@]}"
          mkdir -p "$GITHUB_WORKSPACE/release-ios"
          mv "$RUNNER_TEMP"/export/*.ipa "$GITHUB_WORKSPACE/release-ios/T3-Code-$VERSION.ipa"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-ipa
          path: release-ios/*.ipa
          if-no-files-found: error
